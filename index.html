<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Muhammad Athar — HSE & Safety Officer with 2+ years of experience across construction, infrastructure and manufacturing. Open to Gulf-based roles.">
  <meta name="author" content="Muhammad Athar">
  <meta property="og:title" content="Muhammad Athar — HSE & Safety Officer">
  <meta property="og:description" content="HSE & Safety Officer focused on practical risk control, site safety and incident prevention.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://athar312.github.io/">
  <title>Muhammad Athar | HSE & Safety Officer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='85'>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <!-- The safety visual is rendered locally with CSS/SVG, so it also works offline. -->

  <script>
    function showTime() {
      const currentTime = document.getElementById('currentTime');
      if (currentTime) currentTime.textContent = new Date().toUTCString();
    }

    showTime();
    setInterval(showTime, 1000);

    // Add the local GHS-style hazard pictogram without external assets.
    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.querySelector('.shield-stage');
      if (!stage || stage.querySelector('.safety-visual')) return;

      const visual = document.createElement('div');
      visual.className = 'safety-visual';
      visual.setAttribute('role', 'img');
      visual.setAttribute('aria-label', 'Rotating GHS hazard pictogram');
      visual.innerHTML = `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path fill="currentColor" d="M34 8c2 9-4 12-1 18 2-3 5-5 7-10 7 8 10 14 8 22-2 9-10 15-19 15-11 0-19-7-19-17 0-7 5-13 11-18-1 7 1 10 5 13 0-8 3-16 8-23Z"/>
          <path fill="#171106" d="M35 29c3 5 2 8-1 12 4-2 7-5 7-9 3 4 4 7 3 11-1 5-5 8-10 8-6 0-10-4-10-9 0-4 3-7 7-10-1 4 1 5 3 7 0-4 0-7 1-10Z"/>
        </svg>`;
      stage.replaceChildren(visual);
    });
  </script>

  <style>
    :root {
      --bg: #080808;
      --bg-2: #0e0e0e;
      --panel: #131313;
      --panel-2: #181818;
      --line: #292929;
      --line-gold: rgba(218, 165, 32, .42);
      --text: #f7f4ed;
      --muted: #a9a39a;
      --gold: #d9a520;
      --gold-bright: #f0c34e;
      --gold-soft: rgba(217, 165, 32, .12);
      --green: #42d392;
      --safety-orange: #ff6b00;
      --max: 1120px;
      --nav: 72px;
      --radius: 18px;
      --shadow: 0 24px 80px rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 80% 8%, rgba(217,165,32,.08), transparent 28rem),
        radial-gradient(circle at 10% 35%, rgba(217,165,32,.035), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* RTL Font overrides for Arabic and Urdu localization */
    [dir="rtl"] body {
      font-family: "Cairo", "Noto Nastaliq Urdu", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .24;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    img { max-width: 100%; display: block; }

    :focus-visible {
      outline: 2px solid var(--gold-bright);
      outline-offset: 4px;
    }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin-inline: auto;
    }

    .gold { color: var(--gold-bright); }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--gold-bright);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(66,211,146,.5);
      animation: pulse 2s infinite;
    }

    h1, h2, h3, .brand {
      font-family: "Manrope", sans-serif;
    }

    [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] .brand {
      font-family: "Cairo", sans-serif;
    }

    h2.section-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 44px;
    }

    .section-heading p {
      max-width: 520px;
      color: var(--muted);
    }

    /* Navigation */
    .nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 1000;
      height: var(--nav);
      border-bottom: 1px solid transparent;
      background: rgba(8,8,8,.62);
      backdrop-filter: blur(18px);
      transition: .3s ease;
    }

    .nav.scrolled {
      border-bottom-color: var(--line);
      background: rgba(8,8,8,.93);
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }

    .nav-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand span { color: var(--gold-bright); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .nav-links a {
      padding: 9px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 600;
      transition: .25s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--gold-soft);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang {
      border: 1px solid var(--line);
      color: var(--muted);
      background: #101010;
      border-radius: 9px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: .74rem;
      font-weight: 700;
      transition: .25s ease;
    }

    .lang:hover {
      border-color: var(--gold);
      color: var(--gold-bright);
    }

    .menu {
      display: none;
      border: 1px solid var(--line);
      color: var(--text);
      background: transparent;
      border-radius: 10px;
      padding: 7px 10px;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      min-height: 100svh;
      padding: calc(var(--nav) + 74px) 0 64px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      right: -220px;
      top: 18%;
      border-radius: 50%;
      border: 1px solid rgba(217,165,32,.09);
      box-shadow:
        0 0 0 80px rgba(217,165,32,.018),
        0 0 0 160px rgba(217,165,32,.012);
      animation: orbit 12s linear infinite;
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      gap: 70px;
    }

    .hero-copy h1 {
      margin: 18px 0 12px;
      max-width: 780px;
      font-size: clamp(3.2rem, 7.8vw, 6.7rem);
      line-height: .94;
      letter-spacing: -.065em;
    }

    .hero-copy h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(240,195,78,.65);
    }

    .hero-role {
      color: #d4d0c8;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 600;
    }

    .hero-description {
      max-width: 650px;
      margin: 22px 0 30px;
      color: var(--muted);
      font-size: 1.03rem;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #111;
      color: var(--text);
      font-weight: 700;
      font-size: .9rem;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: 0 12px 28px rgba(0,0,0,.3);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      border-color: var(--gold-bright);
      color: #161106;
      box-shadow: 0 10px 35px rgba(217,165,32,.18);
    }

    .btn.primary:hover {
      box-shadow: 0 16px 40px rgba(217,165,32,.28);
    }

    .btn svg { width: 17px; height: 17px; }

    /* Live HSE Monitor */
    .monitor-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 500px;
    }

    .monitor {
      position: relative;
      width: min(100%, 430px);
      padding: 25px;
      border: 1px solid var(--line-gold);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.012)),
        rgba(14,14,14,.92);
      box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.05);
      overflow: hidden;
      transform: perspective(1000px) rotateY(-5deg);
      transition: transform .5s ease;
    }

    .monitor:hover { transform: perspective(1000px) rotateY(0deg) translateY(-5px); }

    .monitor::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: -140px;
      right: -100px;
      border-radius: 50%;
      background: rgba(217,165,32,.1);
      filter: blur(30px);
    }

    .monitor-head,
    .monitor-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .monitor-head {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .monitor-label {
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .live i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.6s infinite;
    }

    /* Live 3D Animation Stage */
    .shield-stage {
      width: 170px;
      height: 180px;
      margin: 20px auto;
      position: relative;
      display: grid;
      place-items: center;
    }

    .shield-stage::before,
    .shield-stage::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(217,165,32,.28);
      clip-path: polygon(50% 0, 92% 17%, 86% 70%, 50% 100%, 14% 70%, 8% 17%);
      animation: scan 3s ease-in-out infinite;
      pointer-events: none;
    }

    .shield-stage::after {
      inset: 22px;
      border-color: rgba(240,195,78,.55);
      animation-delay: -1.5s;
    }

    /* Self-contained live 3D safety visual */
    .safety-visual {
      width: 112px;
      height: 112px;
      position: relative;
      z-index: 2;
      transform-style: preserve-3d;
      animation: hazardTurn 7s cubic-bezier(.45,0,.55,1) infinite;
      filter: drop-shadow(0 0 18px rgba(217,165,32,.4));
    }

    .safety-visual::before,
    .safety-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid var(--safety-orange);
      background: rgba(255,107,0,.08);
      transform: rotate(45deg) translateZ(-8px);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 0 26px rgba(255,107,0,.2);
    }

    .safety-visual::after {
      transform: rotate(45deg) translateZ(8px);
      border-color: #ffbd3d;
      background: rgba(255,189,61,.05);
    }

    .safety-visual svg {
      position: absolute;
      inset: 23px;
      z-index: 1;
      color: #fff4d0;
      transform: translateZ(16px);
    }

    /* Dynamic CSS 3D Animated Shield Fallback */
    .live-3d-fallback {
      width: 90px;
      height: 100px;
      display: grid;
      place-items: center;
      color: var(--gold-bright);
      filter: drop-shadow(0 0 20px rgba(217,165,32,.35));
      animation: float3D 4s ease-in-out infinite;
    }

    @keyframes hazardTurn {
      0%, 12% { transform: rotateY(0deg) rotateZ(45deg); }
      45% { transform: rotateY(180deg) rotateZ(45deg); }
      55%, 100% { transform: rotateY(360deg) rotateZ(45deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .safety-visual { animation: none; transform: rotateZ(45deg); }
    }

    .monitor-score {
      text-align: center;
      margin-bottom: 24px;
    }

    .monitor-score strong {
      display: block;
      font-family: "Manrope", sans-serif;
      font-size: 3rem;
      line-height: 1;
      color: var(--gold-bright);
    }

    .monitor-score span {
      color: var(--muted);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .monitor-row {
      padding: 13px 0;
      border-top: 1px solid var(--line);
      font-size: .83rem;
    }

    .status {
      color: var(--green);
      font-weight: 800;
      font-size: .7rem;
      letter-spacing: .08em;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      margin-top: 48px;
      max-width: 700px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .hero-stat {
      padding: 17px 20px 17px 0;
      border-right: 1px solid var(--line);
    }

    .hero-stat:not(:first-child) { padding-left: 20px; }
    .hero-stat:last-child { border-right: 0; }

    .hero-stat strong {
      display: block;
      color: var(--gold-bright);
      font-family: "Manrope", sans-serif;
      font-size: 1.55rem;
    }

    .hero-stat span {
      color: var(--muted);
      font-size: .76rem;
    }

    /* Continuous Credentials & Employers Marquee Ticker */
    .ticker-section {
      padding: 24px 0;
      border-block: 1px solid var(--line);
      background: #0b0b0b;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      gap: 48px;
      animation: marquee 25s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .ticker-item span.dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
    }

    /* General sections */
    section { padding: 110px 0; }

    .about {
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.015), transparent);
    }

    .about-grid {
      display: grid;
      grid-template-columns: .7fr 1.3fr;
      gap: 80px;
    }

    .about-copy {
      max-width: 740px;
      color: #d4d0c8;
      font-size: 1.08rem;
    }

    .about-copy p + p { margin-top: 18px; }

    .principles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 42px;
    }

    .principle {
      padding: 22px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
    }

    .principle b {
      display: block;
      margin-bottom: 5px;
      color: var(--gold-bright);
      font-family: "Manrope", sans-serif;
    }

    .principle span {
      color: var(--muted);
      font-size: .83rem;
    }

    /* Experience */
    .timeline {
      position: relative;
      max-width: 920px;
      margin-left: auto;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 9px;
      width: 1px;
      background: linear-gradient(var(--gold), var(--line), transparent);
    }

    .job {
      position: relative;
      padding-left: 48px;
      padding-bottom: 50px;
    }

    .job:last-child { padding-bottom: 0; }

    .job::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 3px;
      width: 13px;
      height: 13px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 0 0 0 6px rgba(217,165,32,.07);
    }

    .job-card {
      padding: 25px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      transition: .35s ease;
    }

    .job-card:hover {
      transform: translateX(6px);
      border-color: var(--line-gold);
      box-shadow: 0 18px 50px rgba(0,0,0,.3);
    }

    .job-date {
      color: var(--gold-bright);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .job h3 {
      margin-top: 7px;
      font-size: 1.2rem;
    }

    .job-company {
      margin-top: 4px;
      color: var(--muted);
      font-size: .87rem;
    }

    .job p {
      margin-top: 13px;
      color: #c8c3bb;
      font-size: .93rem;
    }

    /* Certifications */
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .cert {
      min-height: 210px;
      position: relative;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, var(--panel-2), var(--panel));
      overflow: hidden;
      transition: .35s ease;
    }

    .cert::after {
      content: "01";
      position: absolute;
      right: 18px;
      bottom: -13px;
      color: rgba(255,255,255,.025);
      font: 800 5rem/1 "Manrope", sans-serif;
    }

    .cert:hover {
      transform: translateY(-7px);
      border-color: var(--gold);
      box-shadow: 0 20px 55px rgba(0,0,0,.38);
    }

    .cert-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-gold);
      border-radius: 11px;
      color: var(--gold-bright);
      background: var(--gold-soft);
      font-weight: 800;
      font-size: .85rem;
    }

    .cert h3 {
      margin-top: 20px;
      font-size: 1.05rem;
    }

    .cert p {
      margin-top: 6px;
      color: var(--muted);
      font-size: .8rem;
    }

    /* Skills */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .skill {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      transition: .3s ease;
    }

    .skill:hover {
      border-color: var(--line-gold);
      background: var(--panel-2);
      transform: translateY(-4px);
    }

    .skill-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--gold-bright);
      background: var(--gold-soft);
      border: 1px solid var(--line-gold);
      font-weight: 800;
      font-size: .8rem;
    }

    .skill h3 { font-size: .92rem; }
    .skill p { margin-top: 2px; color: var(--muted); font-size: .76rem; }

    /* Gallery Placeholders */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1.35fr .65fr .65fr;
      grid-auto-rows: 180px;
      gap: 12px;
    }

    .gallery-placeholder {
      position: relative;
      display: flex;
      align-items: end;
      padding: 20px;
      overflow: hidden;
      border: 1px dashed #454545;
      border-radius: 16px;
      background:
        radial-gradient(circle at 70% 30%, rgba(217,165,32,.12), transparent 30%),
        linear-gradient(135deg, #151515, #0d0d0d);
    }

    .gallery-placeholder:first-child { grid-row: span 2; }

    .gallery-placeholder::before {
      content: "PHOTO";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.06);
      font: 800 3.3rem/1 "Manrope", sans-serif;
      letter-spacing: .1em;
    }

    .gallery-placeholder strong,
    .gallery-placeholder span {
      position: relative;
      z-index: 1;
    }

    .gallery-placeholder strong {
      display: block;
      font-family: "Manrope", sans-serif;
    }

    .gallery-placeholder span {
      display: block;
      color: var(--muted);
      font-size: .74rem;
